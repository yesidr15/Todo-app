
<div class="cards">
  <div class="card-container">
  <ion-card class="card contenedor-card" *ngFor="let item of categorias" [color]="item.color">
    <ion-card-header
      (keydown.enter)="setOpen(true, item)"
      (click)="setOpen(true, item)"
    >
      <ion-card-title class="card-header">{{item.texto | truncate:12}}</ion-card-title>
      <ion-card-subtitle>{{contarTodos(item)}}</ion-card-subtitle>
    </ion-card-header>
    <ion-item-sliding *ngIf="item.id!== 10 && item.id!== 20">
      <ion-item class="ultimo" [button]="true">
        <ion-label>Opciones</ion-label>
      </ion-item>
      <ion-item-options class="ultimo" slot="end">

        <ion-item-option
          (keydown.enter)="eliminarCategoria(item)"
          (click)="eliminarCategoria(item)"
          color="danger"
          expandable="true"
        >
          <ion-icon slot="icon-only" name="trash"></ion-icon>
        </ion-item-option>
      </ion-item-options>
    </ion-item-sliding>
  </ion-card>
</div>
</div>
<app-todo-list [categorias]="categorias" [(todosPorCategoria)]="todosPorCategoria" [idCategoriaActual]="idCategoriaActual" [(isModalOpen)]="isModalOpen"></app-todo-list>
