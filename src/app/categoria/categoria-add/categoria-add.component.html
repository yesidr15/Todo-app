<ion-fab class="pt-6" slot="fixed" vertical="top" horizontal="end">
  <ion-fab-button shape="round" id="open-modal" expand="block">
    <ion-icon name="add"></ion-icon>
  </ion-fab-button>
</ion-fab>
<ion-modal class="pt-6" trigger="open-modal" (willDismiss)="onWillDismiss($event)">
  <ng-template>
    <ion-header>
      <ion-toolbar>
        <ion-buttons slot="start">
          <ion-button (keydown.enter)="cancel()" (click)="cancel()"
            >Cancelar</ion-button
          >
        </ion-buttons>
        <ion-title>Agregar categoria</ion-title>
        <ion-buttons slot="end">
          <ion-button
            (keydown.enter)="confirm()"
            (click)="confirm()"
            [strong]="true"
            >Confirmar</ion-button
          >
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <ion-item>
        <ion-input
          labelPlacement="stacked"
          type="text"
          placeholder="Título"
          [(ngModel)]="name"
        ></ion-input>
      </ion-item>

        <ion-button
          shape="round"
          class="button "
          *ngFor="let buttonColor of colores; let i = index"
          #buttonColor
          [class.selected]="colorSelect === buttonColor"
          (keydown.enter)="confirmColor(buttonColor)"
          (click)="confirmColor(buttonColor)"
          [color]="buttonColor"
          ><ion-icon slot="icon-only" ></ion-icon>
        </ion-button>

    </ion-content>
  </ng-template>
</ion-modal>
